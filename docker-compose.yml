services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jogos_escolares
      POSTGRES_USER: jogos
      POSTGRES_PASSWORD: jogos_dev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jogos -d jogos_escolares"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      CORS_ORIGIN: http://localhost:4200
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["4200:80"]
    depends_on:
      - api
