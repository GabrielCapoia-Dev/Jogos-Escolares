services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jogos_escolares
      POSTGRES_USER: jogos
      POSTGRES_PASSWORD: jogos_dev
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jogos -d jogos_escolares"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: jogos-escolares-api:latest
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      CORS_ORIGIN: http://187.77.242.234:18081
      DATABASE_URL: postgres://jogos:jogos_dev@postgres:5432/jogos_escolares?sslmode=disable
      ADMIN_EMAIL: ""
      ADMIN_PASSWORD: ""
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: jogos-escolares-frontend:latest
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "18081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: ${JOGOS_POSTGRES_VOLUME:-99e7f9f1edfb70fe4d8ef5109b30cb80060ab37afbc76ee6d5a464d94985f4ef}
